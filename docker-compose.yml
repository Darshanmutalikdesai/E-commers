services:
  migrate:
    build:
      context: .
      target: dependencies
    command: ["npm", "run", "db:deploy"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?Set TOKEN_HASH_SECRET in .env}
      REFRESH_SESSION_DAYS: ${REFRESH_SESSION_DAYS:-30}
      EMAIL_OTP_MINUTES: ${EMAIL_OTP_MINUTES:-10}
      SMTP_HOST: ${SMTP_HOST-}
      SMTP_PORT: ${SMTP_PORT-}
      SMTP_USER: ${SMTP_USER-}
      SMTP_PASSWORD: ${SMTP_PASSWORD-}
      SMTP_FROM: ${SMTP_FROM-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - product_uploads:/app/uploads/products

volumes:
  product_uploads:
